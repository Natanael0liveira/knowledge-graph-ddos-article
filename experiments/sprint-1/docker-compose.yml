services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: kg-ddos-fuseki
    ports:
      - "3030:3030"
    environment:
      # Senha de admin (mude se quiser)
      - ADMIN_PASSWORD=kgddos
      # JVM heap
      - JVM_ARGS=-Xmx2g
    volumes:
      # TDB2 backend no SSD interno (APFS). ExFAT (DATA_ROOT) trava o TDB2:
      # memory-map + fsync sem semântica POSIX => commit por chunk faz thrashing.
      # Dados crus e TTL exportado continuam em DATA_ROOT; só o banco mora local.
      - ${FUSEKI_DB}:/fuseki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
