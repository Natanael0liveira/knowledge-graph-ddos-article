# Cenário FURTIVO (mimético) — cada sessão atacante é individualmente
# indistinguível de um usuário legítimo (n_req, duração, UA amostrados do benigno).
# A campanha SÓ é detectável pela estrutura cross-session (JA4/alvo/prefixo
# compartilhados). É o caso decisivo da tese: detecção por-sessão falha,
# cross-session acerta. Varie K via --param K=1|50|1000.

K: 1000
legitimate_sessions: 1000
attack_variant: slowloris   # ignorado quando stealth=true (features vêm do benigno)
window_s: 300
stealth: true

# Coordenação alta nos sinais fortes (caro de pulverizar para o atacante)
coordination_ja4_share: 0.9
coordination_identity_reuse: 0.2
coordination_temporal_jitter: 0.3

# Distribuição agressiva de rede (Mirai-style): muitos /24 e ASNs
asn_dispersion: 100
prefix_dispersion: 50
