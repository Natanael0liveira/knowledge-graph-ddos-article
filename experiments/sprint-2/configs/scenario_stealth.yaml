# Cenário FURTIVO (mimético) — cada sessão atacante é individualmente
# indistinguível de um usuário legítimo (n_req, duração, UA amostrados do benigno).
# A campanha SÓ é detectável pela estrutura cross-session (JA4/alvo/prefixo
# compartilhados). É o caso decisivo da tese: detecção por-sessão falha,
# cross-session acerta. Varie K via --param K=1|50|1000.

K: 1000
legitimate_sessions: 1000
attack_variant: slowloris   # ignorado quando stealth=true (features vêm do benigno)
window_s: 300
stealth: true

# Diversidade de JA4 benigno realista da internet (milhares de fingerprints), não as
# dezenas de um lab. Necessária para que o JA4 compartilhado do atacante seja
# discriminativo — caso contrário legítimos colidem em JA4 mais que a campanha.
benign_ja4_pool: 2000

# Cenário realista de produção: usuários legítimos acessam o MESMO serviço atacado (:443),
# não portas diversas. Remove o artefato em que a porta-alvo separa trivialmente o ataque
# do benigno (config (b)). Com isto, só a coordenação entre sessões (JA4) discrimina.
benign_same_service: true

# Coordenação alta nos sinais fortes (caro de pulverizar para o atacante)
coordination_ja4_share: 0.9
coordination_identity_reuse: 0.2
coordination_temporal_jitter: 0.3

# Distribuição agressiva de rede (Mirai-style): ~1 bot por /24, para K até ~2000.
# Proximidade de rede deliberadamente fraca (botnet disperso) — o sinal forte é o
# JA4 compartilhado. É isto que separa (d) de (c) em cenário distribuído.
asn_dispersion: 2000
prefix_dispersion: 2000
